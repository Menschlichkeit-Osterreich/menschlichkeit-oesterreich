engines:
  eslint-8:
    enabled: true
  remark-lint:
    enabled: true
  stylelint:
    enabled: false
  trivy:
    enabled: true
  pmd:
    enabled: false

exclude_paths:
  - '.agents/**'
  - '.claude/**'
  - '.gemini/**'
  - '.cache/**'
  - '.mcp/**'
  - '.tmp/**'
  - '.trivycache/**'
  - '_MIGRATION/**'
  - 'attached_assets/**'
  - 'analysis/archive/**'
  - 'codacy-analysis-cli-master/**'
  - 'codacy-analysis-cli/**'
  - 'crm.menschlichkeit-oesterreich.at/web/core/tests/**'
  - 'docs/archive/**'
  - 'figma-design-system/**'
  - 'logs/**'
  - 'node_modules/**'
  - 'quality-reports/**'
  - 'reports/**'
  - 'secrets/**'
  - 'tests/fixtures/**'

categories:
  CodeStyle:
    enabled: true
  ErrorProne:
    enabled: true
  Security:
    enabled: true
  Performance:
    enabled: true

max-allowed-issues: 25
