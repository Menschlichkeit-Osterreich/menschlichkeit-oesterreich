engines:
  eslint-8:
    enabled: true
    patterns:
      - include:
          - 'apps/website/**/*.{js,jsx,mjs,cjs}'
          - 'apps/api/**/*.{js,mjs}'
          - 'apps/crm/**/*.{js,mjs}'
          - 'scripts/**/*.{js,mjs,cjs}'
          - '.github/**/*.{js,mjs,cjs}'
          - '.claude/**/*.{js,mjs,cjs}'
  remark-lint:
    enabled: true
  stylelint:
    enabled: false
  trivy:
    enabled: true
    patterns:
      - include:
          - 'package*.json'
          - '**/package-lock.json'
          - '**/requirements*.txt'
          - '**/poetry.lock'
          - '**/Pipfile.lock'
          - '**/pyproject.toml'
          - '**/go.mod'
          - '**/go.sum'
          - '**/Cargo.toml'
          - '**/Cargo.lock'
          - '**/composer.json'
          - '**/composer.lock'
          - '**/pom.xml'
          - '**/build.gradle'
          - '**/build.gradle.kts'
          - '**/Gemfile'
          - '**/Gemfile.lock'
  pmd:
    enabled: false

exclude_paths:
  - '.agents/**'
  - '.claude/**'
  - '.gemini/**'
  - '.cache/**'
  - '.mcp/**'
  - '.tmp/**'
  - '.trivycache/**'
  - '_MIGRATION/**'
  - 'attached_assets/**'
  - 'analysis/archive/**'
  - 'apps/babylon-game/**'
  - 'apps/website/**'
  - 'codacy-analysis-cli-master/**'
  - 'codacy-analysis-cli/**'
  - 'crm.menschlichkeit-oesterreich.at/web/core/tests/**'
  - 'docs/archive/**'
  - 'figma-design-system/**'
  - 'logs/**'
  - 'mcp-servers/**'
  - 'node_modules/**'
  - 'quality-reports/**'
  - 'reports/**'
  - 'secrets/**'
  - 'services/**'
  - 'tests/fixtures/**'

categories:
  CodeStyle:
    enabled: true
  ErrorProne:
    enabled: true
  Security:
    enabled: true
  Performance:
    enabled: true

max-allowed-issues: 25
