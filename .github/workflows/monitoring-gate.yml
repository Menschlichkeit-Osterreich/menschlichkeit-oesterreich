name: Monitoring Gate

'on':
  workflow_dispatch:
  push:
    paths:
      - 'monitoring/masterplan/**'
      - 'scripts/masterplan/simulate-critical-alerts.sh'
      - 'scripts/masterplan/verify-alert-ack-sla.sh'
      - 'runbooks/operations-masterplan/slo-sla-policy.md'

jobs:
  monitoring-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Simulate Alerts
        run: bash scripts/masterplan/simulate-critical-alerts.sh
      - name: Verify Ack SLA
        run: bash scripts/masterplan/verify-alert-ack-sla.sh
