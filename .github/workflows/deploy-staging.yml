name: Deploy Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  MAIN_DOMAIN: ${{ vars.MAIN_DOMAIN || 'menschlichkeit-oesterreich.at' }}
  STAGING_FRONTEND_REMOTE_PATH: ${{ vars.STAGING_FRONTEND_PATH || 'httpdocs' }}

jobs:
  build-and-deploy:
    name: Build & Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: BSM-Secrets in Job-Umgebung laden
        uses: ./.github/actions/bsm-env-inject
        with:
          profile: deploy-staging
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}

      - name: Add host to known_hosts
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          # PLESK_KNOWN_HOSTS muss im GitHub-Environment 'staging' abgelegt sein.
          # Erzeugen via: ssh-keyscan -p <port> <host> auf einem vertrauenswürdigen System,
          # dann als Secret PLESK_KNOWN_HOSTS speichern. Nie ssh-keyscan live im CI nutzen
          # (MITM-Angriff möglich während des TOFU-Vorgangs).
          if [ -z "${PLESK_KNOWN_HOSTS:-}" ]; then
            echo "::error::Secret PLESK_KNOWN_HOSTS ist nicht gesetzt. Bitte im GitHub-Environment 'staging' hinterlegen."
            exit 1
          fi
          printf '%s\n' "${PLESK_KNOWN_HOSTS}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run quality gates
        run: npm run quality:gates

      - name: Build workspace
        run: npm run build:all

      - name: Prepare SSH key (native, policy-konform)
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${PLESK_SSH_PRIVATE_KEY}" > ~/.ssh/staging_deploy_key
          chmod 600 ~/.ssh/staging_deploy_key

      - name: Add host to known_hosts
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          # PLESK_KNOWN_HOSTS muss im GitHub-Environment 'staging' abgelegt sein.
          # Erzeugen via: ssh-keyscan -p <port> <host> auf einem vertrauenswürdigen System,
          # dann als Secret PLESK_KNOWN_HOSTS speichern. Nie ssh-keyscan live im CI nutzen
          # (MITM-Angriff möglich während des TOFU-Vorgangs).
          if [ -z "${PLESK_KNOWN_HOSTS:-}" ]; then
            echo "::error::Secret PLESK_KNOWN_HOSTS ist nicht gesetzt. Bitte im GitHub-Environment 'staging' hinterlegen."
            exit 1
          fi
          printf '%s\n' "${PLESK_KNOWN_HOSTS}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Configure SSH host alias
        env:
          PLESK_PORT: ${{ env.PLESK_PORT || '22' }}
        run: |
          set -euo pipefail
          cat > ~/.ssh/config <<EOF
          Host plesk-staging
            HostName ${PLESK_HOST}
            User ${REMOTE_USER}
            Port ${PLESK_PORT}
            IdentityFile ~/.ssh/staging_deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy frontend to staging (deterministisch, non-interaktiv)
        run: |
          set -euo pipefail

          test -d apps/website/dist || { echo "::error::Frontend-Artefakt fehlt"; exit 1; }
          ssh -F ~/.ssh/config plesk-staging "mkdir -p '${STAGING_FRONTEND_REMOTE_PATH}'"
          find apps/website/dist -name "*.map" -delete

          scp -r -F ~/.ssh/config \
            apps/website/dist/. \
            "plesk-staging:${STAGING_FRONTEND_REMOTE_PATH}/"

          TS=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          MARKER="service=frontend commit=${GITHUB_SHA::8} timestamp=${TS} actor=${GITHUB_ACTOR}"
          ssh -F ~/.ssh/config plesk-staging \
            "printf '%s\n' '${MARKER}' > '${STAGING_FRONTEND_REMOTE_PATH}/.deploy_release'"

      - name: Verify staging release marker
        run: |
          set -euo pipefail
          MARKER=$(ssh -F ~/.ssh/config plesk-staging "cat '${STAGING_FRONTEND_REMOTE_PATH}/.deploy_release'" || true)
          echo "${MARKER}"
          echo "${MARKER}" | grep -q "commit=${GITHUB_SHA::8}" || {
            echo "::error::Staging Release-Marker zeigt nicht auf den erwarteten Commit";
            exit 1;
          }
