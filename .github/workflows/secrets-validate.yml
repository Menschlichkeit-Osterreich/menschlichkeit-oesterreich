name: Secrets Validate
'on':
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'secrets.manifest.json'
      - 'scripts/secrets/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'secrets.manifest.json'
      - 'scripts/secrets/**'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Validate secrets (static + optional API)
        env:
          # ADMIN_PAT ist ein veralteter Alias fuer GH_ADMIN_TOKEN (kanonischer Name).
          # Langfristig diesen Eintrag auf secrets.GH_ADMIN_TOKEN umstellen.
          REQ_PAT: ${{ secrets.ADMIN_PAT }} # optional PAT mit repo/admin:org
        run: bash scripts/secrets/validate-secrets.sh secrets.manifest.json
