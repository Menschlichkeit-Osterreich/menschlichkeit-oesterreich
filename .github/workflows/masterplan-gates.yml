name: Masterplan Gates

'on':
  workflow_dispatch:
  push:
    paths:
      - 'runbooks/operations-masterplan/**'
      - 'deployment-scripts/infra/terraform/**'
      - 'config-templates/masterplan-no-go-rules.json'
      - 'scripts/masterplan/run-gate-checks.sh'
      - 'reports/masterplan/**'

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Gate Checks
        run: bash scripts/masterplan/run-gate-checks.sh
      - name: Upload Evidence Log
        uses: actions/upload-artifact@v7
        with:
          name: evidence-log
          path: reports/masterplan/evidence-log.md
