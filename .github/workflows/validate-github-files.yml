name: Validate .github metadata

on:
  push:
    paths:
      - '.github/**'
      - 'scripts/validate-github-files.py'
      - 'scripts/normalize-frontmatter.py'
      - 'scripts/ci/validate-workflow-cache-paths.py'
  pull_request:
    paths:
      - '.github/**'
      - 'scripts/validate-github-files.py'
      - 'scripts/normalize-frontmatter.py'
      - 'scripts/ci/validate-workflow-cache-paths.py'

permissions:
  contents: read # Required for GITHUB_TOKEN to access /repos API endpoint

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'

      - name: Validate .github files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/validate-github-files.py | tee validation.log

      # Verhindert die Wiederkehr von Finding P0-002: ein nicht aufloesbarer
      # cache-dependency-path laesst setup-node fehlschlagen und ueberspringt
      # dadurch stillschweigend den Produktions-Deploy-Job.
      - name: Validate workflow cache-dependency-path targets
        shell: bash
        run: python3 scripts/ci/validate-workflow-cache-paths.py

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-metadata-validation-log
          path: validation.log
