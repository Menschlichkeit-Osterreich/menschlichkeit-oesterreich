name: MCP Server Tests

on:
  push:
    branches: [main, master, chore/**, feature/**]
    paths:
      - 'mcp-servers/file-server/**'
      - '.github/workflows/mcp-tests.yml'
  pull_request:
    paths:
      - 'mcp-servers/file-server/**'

permissions:
  contents: read

jobs:
  test-file-server:
    name: MCP Server Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
      MCP_OPA_REQUIRED: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (root)
        run: npm install --silent

      - name: Install workspace deps (file-server)
        working-directory: mcp-servers/file-server
        run: npm install --silent

      - name: Run tests (file-server)
        working-directory: mcp-servers/file-server
        run: npm test
