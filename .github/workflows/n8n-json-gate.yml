name: gate-1-n8n-json-validity

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/n8n/workflows/**/*.json'
      - 'automation/n8n/workflow-inventory.production.json'
      - 'scripts/validate-n8n-workflows.mjs'
      - '.github/workflows/n8n-json-gate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'automation/n8n/workflows/**/*.json'
      - 'automation/n8n/workflow-inventory.production.json'
      - 'scripts/validate-n8n-workflows.mjs'
      - '.github/workflows/n8n-json-gate.yml'

permissions:
  contents: read

jobs:
  validate-n8n-json:
    name: Gate 1 - Validate active n8n workflow JSON
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.2.0
        with:
          node-version: '22'

      - name: Run inventory-based n8n JSON validation
        run: npm run n8n:validate
