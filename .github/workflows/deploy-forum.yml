name: deploy-forum

on:
  # Manuell/gated only: Die Produktionsumgebung (forum-production) darf NICHT
  # allein durch einen Push auf main live schreiben (Contract 5.1). Auslösung
  # ausschließlich über workflow_dispatch bzw. eine explizite Promotion.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-forum-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Forum → Plesk (forum-production)
    runs-on: ubuntu-latest
    environment: forum-production
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # PLESK-Verbindungssecrets kommen aus Bitwarden Secrets Manager (BSM),
      # nicht mehr als direkt duplizierte GitHub-Environment-Secrets (5.3).
      # Profil deploy-forum liefert PLESK_HOST/PLESK_PORT/REMOTE_USER/
      # PLESK_SSH_PRIVATE_KEY/PLESK_KNOWN_HOSTS in die Job-Umgebung.
      - name: BSM-Secrets in Job-Umgebung laden
        uses: ./.github/actions/bsm-env-inject
        with:
          profile: deploy-forum
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}

      - name: SSH known_hosts aus BSM einrichten
        run: |
          mkdir -p ~/.ssh
          # StrictHostKeyChecking bleibt aktiv; kein ssh-keyscan als Vertrauensersatz.
          printf '%s\n' "${PLESK_KNOWN_HOSTS}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Rsync zu Plesk
        # burnett01/rsync-deployments SHA-gepinnt (kein floating Tag)
        uses: burnett01/rsync-deployments@ea6bf48e0a41f53afbe82bfdc6a7cae52efff86b # 6.0.0
        with:
          switches: -avzr --delete
          # Quelle bleibt web/forum/: der kanonische apps/forum/-Pfad (5.3)
          # existiert im Repository noch nicht; die Relokation ist ein separater
          # Follow-up und darf den Deploy nicht auf ein leeres Verzeichnis zeigen.
          path: web/forum/
          remote_path: /var/www/vhosts/menschlichkeit-oesterreich.at/subdomains/forum/httpdocs/
          remote_host: ${{ env.PLESK_HOST }}
          remote_user: ${{ env.REMOTE_USER }}
          remote_key: ${{ env.PLESK_SSH_PRIVATE_KEY }}

      - name: Post-Deploy (Berechtigungen + Cache-Flush)
        # appleboy/ssh-action SHA-gepinnt
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a3b3b6a9b970 # v1.2.2
        with:
          host: ${{ env.PLESK_HOST }}
          username: ${{ env.REMOTE_USER }}
          key: ${{ env.PLESK_SSH_PRIVATE_KEY }}
          script: |
            set -e
            FORUM_ROOT=/var/www/vhosts/menschlichkeit-oesterreich.at/subdomains/forum/httpdocs
            cd "$FORUM_ROOT"

            # Cache leeren
            find ./cache -type f -not -name 'index.htm*' -delete || true

            # Berechtigungen setzen (Plesk-Standard: psacln-Gruppe)
            chown -R "$USER":psacln ./cache ./files ./store ./images/avatars/upload
            chmod -R 775 ./cache ./files ./store ./images/avatars/upload

            # Design-Token-CSS prüfen
            if [ -f styles/moe-theme/theme/tokens.css ]; then
              echo "Design-Token-CSS vorhanden."
            fi

      - name: Forum-Erreichbarkeit prüfen
        run: |
          sleep 10
          HTTP_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            https://forum.menschlichkeit-oesterreich.at/)
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "301" ] && [ "$HTTP_STATUS" != "302" ]; then
            echo "Forum antwortet nicht korrekt: HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Forum erreichbar: HTTP $HTTP_STATUS"
