# Nginx configuration for n8n.menschlichkeit-oesterreich.at
# Workflow automation platform for Menschlichkeit Österreich
# DSGVO Art. 32 konform – Security Headers + Logging

# HTTP → HTTPS Redirect
server {
    listen 80;
    server_name n8n.menschlichkeit-oesterreich.at;
    # nosemgrep: nginx-host-header-injection -- redirect target uses hardcoded hostname, not $host/$http_host
    return 301 https://n8n.menschlichkeit-oesterreich.at$request_uri;
}

# Upstream zu n8n (Docker Container oder lokaler Service)
# Optionen:
# - unix:/run/n8n/n8n.sock (wenn via systemd/socket)
# - localhost:5678 (wenn Docker mit Port-Expose)
# - 127.0.0.1:5678 (explizit localhost)
upstream moe_n8n_backend {
    server localhost:5678 fail_timeout=0;
    # Falls Docker nicht antwortet, 60 Sekunden timeout
}

# HTTPS Server Block
server {
    listen 443 ssl http2;
    server_name n8n.menschlichkeit-oesterreich.at;

    # TLS-Zertifikat (Let's Encrypt via Plesk)
    include /etc/nginx/snippets/moe-tls.conf;

    # Security Headers (DSGVO + OWASP)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss://n8n.menschlichkeit-oesterreich.at; frame-ancestors 'self';" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Client Upload Limit (für n8n Workflows/Imports)
    client_max_body_size 50M;

    # Health Check Endpoint (öffentlich erreichbar)
    location = /healthz {
        proxy_pass http://moe_n8n_backend/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Webhook Endpoint (für externe Services wie Stripe, PayPal)
    # Muss öffentlich erreichbar sein – keine Auth
    location ~ ^/webhook/ {
        proxy_pass http://moe_n8n_backend;
        proxy_http_version 1.1;

        # Headers für n8n Webhook Processing
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Längere Timeouts für Webhook-Processing
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Logging (ohne PII – siehe DSGVO-Compliance)
        access_log /var/log/nginx/n8n_webhook_access.log main;
        error_log /var/log/nginx/n8n_webhook_error.log warn;
    }

    # Main Application (n8n UI + API)
    location / {
        proxy_pass http://moe_n8n_backend;
        proxy_http_version 1.1;

        # WebSocket Support (für n8n UI Real-Time)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # Buffering für große Responses
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # Timeouts für lange laufende Workflows
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Logging
        access_log /var/log/nginx/n8n_access.log main;
        error_log /var/log/nginx/n8n_error.log warn;
    }

    # Static Assets Cache (n8n Frontend Bundle)
    location ~* \.(?:js|css|png|svg|ico|woff|woff2|ttf|eot|json)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
